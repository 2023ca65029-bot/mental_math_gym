<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Practice Cubes</title>

  <link rel="stylesheet" href="cubes.css">

</head>


<body>


  <div class="practice-container">


    <!-- =========================
         RANGE SELECTION SCREEN
         ========================= -->

    <div id="setup-screen">

      <h1>🔢 Practice Cubes</h1>

      <p class="subtitle">
        Choose your number range
      </p>


      <div class="range-inputs">


        <div class="input-group">

          <label for="min-number">
            From
          </label>

          <input
            type="number"
            id="min-number"
            value="1"
            min="1"
          >

        </div>


        <span class="to-text">
          to
        </span>


        <div class="input-group">

          <label for="max-number">
            To
          </label>

          <input
            type="number"
            id="max-number"
            value="20"
            min="1"
          >

        </div>


      </div>


      <!-- Error message -->

      <p
        id="range-error"
        class="error-message"
      ></p>


      <!-- Start -->

      <button
        class="start-button"
        onclick="startPractice()"
      >
        Start Practice
      </button>


      <!-- Home -->

      <a
        href="index.html"
        class="back-link"
      >
        ← Back to Home
      </a>

    </div>



    <!-- =========================
         PRACTICE SCREEN
         ========================= -->

    <div
      id="practice-screen"
      class="hidden"
    >


      <h1>🔢 Practice Cubes</h1>


      <p class="instruction">
        What is the cube of:
      </p>


      <!-- Number -->

      <div id="number-display">
        8
      </div>


      <!-- Answer -->

      <div class="answer-area">


        <input
          type="number"
          id="answer-input"
          placeholder="Enter your answer"
          autocomplete="off"
        >


        <button
          class="check-button"
          onclick="checkAnswer()"
        >
          Check
        </button>


      </div>


      <!-- Feedback -->

      <p id="feedback"></p>


      <!-- Stop -->

      <button
        class="stop-button"
        onclick="stopPractice()"
      >
        Stop Practice
      </button>


    </div>


  </div>


  <script src="cubes.js"></script>

</body>

</html>
