<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Basic Calculator</title>

  <link rel="stylesheet" href="calculator.css">
</head>

<body>

  <div class="calculator">

    <!-- Display -->

    <input
      type="text"
      id="display"
      readonly
      placeholder="0"
    >


    <!-- Calculator Buttons -->

    <div class="buttons">

      <!-- Row 1 -->

      <button onclick="appendValue('1')">
        1
      </button>

      <button onclick="appendValue('2')">
        2
      </button>

      <button onclick="appendValue('3')">
        3
      </button>


      <!-- Row 2 -->

      <button onclick="appendValue('4')">
        4
      </button>

      <button onclick="appendValue('5')">
        5
      </button>

      <button onclick="appendValue('6')">
        6
      </button>


      <!-- Row 3 -->

      <button onclick="appendValue('7')">
        7
      </button>

      <button onclick="appendValue('8')">
        8
      </button>

      <button onclick="appendValue('9')">
        9
      </button>


      <!-- Row 4 -->

      <button
        class="back"
        onclick="deleteLast()"
      >
        ⌫
      </button>

      <button onclick="appendValue('0')">
        0
      </button>

      <button
        class="clear"
        onclick="clearDisplay()"
      >
        C
      </button>


      <!-- Row 5 -->

      <button
        class="operator"
        onclick="appendValue('+')"
      >
        +
      </button>

      <button
        class="operator"
        onclick="appendValue('-')"
      >
        −
      </button>

      <button
        class="operator"
        onclick="appendValue('*')"
      >
        ×
      </button>


      <!-- Row 6 -->

      <button
        class="operator"
        onclick="appendValue('/')"
      >
        ÷
      </button>

      <button onclick="appendValue('.')">
        .
      </button>

      <button
        class="equals"
        onclick="calculate()"
      >
        =
      </button>

    </div>


    <!-- Back to Home -->

    <a href="index.html" class="home-link">
      ← Back to Home
    </a>

  </div>


  <script src="script.js"></script>

</body>

</html>
