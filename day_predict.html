<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Predict Day from Date</title>

  <link rel="stylesheet" href="day-predict.css">

</head>


<body>


  <div class="practice-container">

    <div id="practice-screen">

      <h1>📅 Predict Day</h1>

      <p class="instruction">
        What day is this date? (DD/MM/YYYY)
      </p>


      <div id="date-display">
        15 May 2024
      </div>


      <div id="answer-options" class="answer-options"></div>


      <p id="feedback"></p>


      <button
        class="new-button"
        onclick="nextQuestion()"
      >
        New Date
      </button>


      <a
        href="index.html"
        class="back-link"
      >
        ← Back to Home
      </a>

    </div>


  </div>


  <script src="day-predict.js"></script>

</body>

</html>
